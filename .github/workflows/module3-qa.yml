name: Module 3 media and browser QA
on:
  push:
    branches: [academy-player-preview]
    paths: ['academy/module-3/**','academy/tests/module3*','assets/academy/module-3/**','academy-lesson-3-*.html','academy-module-3*.html','academy/review/module-3/**','.github/workflows/module3-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: module3-preview-qa
  cancel-in-progress: false
jobs:
  build-test:
    if: github.ref == 'refs/heads/academy-player-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install pillow soundfile numpy kokoro-onnx==0.4.9
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: /tmp/module3-tts
          key: module3-kokoro-v1-${{ hashFiles('academy/module-3/content.json', 'academy/module-3/caption_display.py') }}
          restore-keys: module3-kokoro-v1-
      - name: Recover revised illustrations without resynthesizing narration
        run: python3 academy/module-3/refresh-visuals.py
      - name: Build media when missing
        run: |
          if ! python3 academy/module-3/media-current.py; then
            mkdir -p /tmp/module3-tts
            curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx -o /tmp/module3-tts/kokoro-v1.0.onnx
            curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -o /tmp/module3-tts/voices-v1.0.bin
            python3 academy/module-3/narrate.py
          fi
      - name: Verify source and committed media
        run: |
          python3 academy/tests/module3-content.py
          python3 academy/tests/module3-media.py
          python3 academy/module-3/build.py
          node academy/module-3/stamp-build.cjs
          node validate-site.cjs
      - name: Browser QA
        env:
          PLAYWRIGHT_MODULE: playwright
          AXE_PATH: node_modules/axe-core/axe.min.js
          RESULT_PATH: academy/review/module-3/browser-results.json
          SCREENSHOT_DIR: /tmp
        run: |
          python3 academy/tests/serve-preview.py >/tmp/module3-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8092/academy-module-3.html >/dev/null && break || sleep 1; done
          node academy/tests/module3-browser.cjs
      - name: Persist generated assets after QA
        run: |
          python3 academy/module-3/build.py
          git config user.name 'ValiStera Academy QA'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/academy/module-3/ academy/review/module-3/ academy-lesson-3-*.html academy-module-3*.html
          if ! git diff --cached --quiet; then
            git commit -m 'Persist tested Module 3 narration, captions, diagrams and browser evidence'
            git push origin HEAD:academy-player-preview
          fi
      - name: Verify actual Cloudflare preview commit and delivered bytes
        run: |
          node academy/module-3/stamp-build.cjs
          expected=$(git rev-parse HEAD)
          base=https://academy-player-preview-valistera-website.gadadeakash72.workers.dev
          for attempt in $(seq 1 36); do
            served=$(curl -fsS --max-time 20 "$base/assets/academy/module-3/review/review-build.json?check=$expected" | python3 -c 'import json,sys; print(json.load(sys.stdin)["source_commit"])' || true)
            if [ "$served" = "$expected" ]; then break; fi
            sleep 10
          done
          test "$served" = "$expected"
          python3 academy/tests/module3-delivery.py "$base" "$expected" academy/review/module-3/hosted-delivery-results.json
      - name: Browser QA on actual hosted preview
        env:
          BASE_URL: https://academy-player-preview-valistera-website.gadadeakash72.workers.dev
          PLAYWRIGHT_MODULE: playwright
          AXE_PATH: node_modules/axe-core/axe.min.js
          RESULT_PATH: academy/review/module-3/hosted-browser-results.json
          SCREENSHOT_DIR: /tmp
        run: node academy/tests/module3-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module3-review-evidence
          path: |
            academy/review/module-3/
            assets/academy/module-3/
            /tmp/module3-*.png
            /tmp/module3-http.log
