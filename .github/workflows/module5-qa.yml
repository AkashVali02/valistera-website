name: Module 5 media and browser QA
on:
  push:
    branches: [academy-module-5]
    paths: ['academy/module-5/**','academy/tests/module5*','assets/academy/module-5/**','academy-lesson-5-*.html','academy-module-5*.html','academy/review/module-5/**','.github/workflows/module5-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: module5-preview-qa
  cancel-in-progress: true
jobs:
  build-test:
    if: github.ref == 'refs/heads/academy-module-5'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OS media dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python media dependencies
        timeout-minutes: 5
        run: pip install --timeout 60 --retries 2 pillow soundfile numpy kokoro-onnx==0.4.9
      - name: Install browser test packages
        timeout-minutes: 5
        run: npm install --no-save --fetch-timeout=120000 --fetch-retries=2 playwright axe-core
      - name: Install Chromium and system libraries
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: /tmp/module5-tts
          key: module5-kokoro-v1-${{ hashFiles('academy/module-5/content.json', 'academy/module-5/caption_display.py', 'academy/module-5/caption_chunks.py') }}
          restore-keys: module5-kokoro-v1-
      - name: Build media when missing
        run: |
          if ! python3 academy/module-5/media-current.py; then
            mkdir -p /tmp/module5-tts
            curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx -o /tmp/module5-tts/kokoro-v1.0.onnx
            curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -o /tmp/module5-tts/voices-v1.0.bin
            python3 academy/module-5/narrate.py
          fi
      - name: Verify source and committed media
        run: |
          python3 academy/tests/module5-content.py
          python3 academy/tests/module5-media.py
          python3 academy/tests/module5-frames.py
          python3 academy/module-5/qa-report.py
          python3 academy/module-5/build.py
          node academy/module-5/stamp-build.cjs
          node validate-site.cjs
      - name: Browser QA
        env:
          PLAYWRIGHT_MODULE: playwright
          AXE_PATH: node_modules/axe-core/axe.min.js
          RESULT_PATH: academy/review/module-5/browser-results.json
          SCREENSHOT_DIR: /tmp
        run: |
          python3 academy/tests/serve-preview.py >/tmp/module5-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8092/academy-module-5.html >/dev/null && break || sleep 1; done
          node academy/tests/module5-browser.cjs
      - name: Persist generated assets and QA evidence
        if: ${{ !cancelled() }}
        run: |
          python3 academy/module-5/qa-report.py
          python3 academy/module-5/build.py
          python3 academy/module-5/media-current.py
          git config user.name 'ValiStera Academy QA'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/academy/module-5/ academy/review/module-5/ academy-lesson-5-*.html academy-module-5*.html
          if ! git diff --cached --quiet; then
            git commit -m 'Persist Module 5 media and measured QA evidence for draft review'
            git push origin HEAD:academy-module-5
          fi
      - name: Verify actual Cloudflare preview commit and delivered bytes
        run: |
          node academy/module-5/stamp-build.cjs
          expected=$(git rev-parse HEAD)
          base=https://academy-module-5-valistera-website.gadadeakash72.workers.dev
          for attempt in $(seq 1 18); do
            status=$(curl -sS --max-time 20 -w '%{http_code}' "$base/assets/academy/module-5/review/review-build.json?check=$expected" -o /tmp/module5-hosted-response.txt || true)
            echo "Preview attempt $attempt HTTP $status"
            if [ "$status" = 403 ]; then echo 'Preview access denied; response retained in evidence'; exit 1; fi
            served=$(python3 -c 'import json; print(json.load(open("/tmp/module5-hosted-response.txt"))["source_commit"])' 2>/dev/null || true)
            if [ "$served" = "$expected" ]; then break; fi
            sleep 10
          done
          test "$served" = "$expected"
          # A new manifest can arrive before every edge serves the matching assets.
          # Preserve each complete attempt; never waive a persistent byte mismatch.
          delivered=false
          for delivery_attempt in $(seq 1 3); do
            if python3 academy/tests/module5-delivery.py "$base" "$expected" "academy/review/module-5/hosted-delivery-attempt-$delivery_attempt.json"; then
              cp "academy/review/module-5/hosted-delivery-attempt-$delivery_attempt.json" academy/review/module-5/hosted-delivery-results.json
              delivered=true
              break
            fi
            sleep 20
          done
          test "$delivered" = true
      - name: Browser QA on actual hosted preview
        env:
          BASE_URL: https://academy-module-5-valistera-website.gadadeakash72.workers.dev
          PLAYWRIGHT_MODULE: playwright
          AXE_PATH: node_modules/axe-core/axe.min.js
          RESULT_PATH: academy/review/module-5/hosted-browser-results.json
          SCREENSHOT_DIR: /tmp
        run: EXPECTED_COMMIT=$(git rev-parse HEAD) node academy/tests/module5-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module5-review-evidence
          path: |
            academy/review/module-5/
            assets/academy/module-5/
            /tmp/module5-*.png
            /tmp/module5-http.log
            /tmp/module5-hosted-response.txt
