name: Module 2 preview browser QA
on:
  push:
    branches: [academy-player-preview]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild corrected diagrams
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install pillow
          python3 academy/module-2/align_diagrams.py
          python3 academy/module-2/rebuild_video_frames.py
      - name: Save aligned preview diagrams
        if: github.event_name == 'push'
        run: |
          git config user.name 'ValiStera Academy QA'
          git config user.email 'actions@users.noreply.github.com'
          git add academy/module-2/render.py assets/academy/module-2/*-scene-*.png assets/academy/module-2/lesson-*.mp4
          git diff --cached --quiet || (git commit -m 'Regenerate aligned lesson diagrams' && git push)
      - name: Install browser testing dependencies
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python3 -m http.server 8092 --bind 127.0.0.1 > /tmp/module2-http.log 2>&1 &
          sleep 3
      - name: Diagnose browser and media environment
        run: |
          node --version
          python3 --version
          ls -lh academy-lesson-2-1.html assets/academy/module-2/lesson-1.mp4 node_modules/axe-core/axe.min.js
          curl --fail --silent --show-error --head http://127.0.0.1:8092/academy-lesson-2-1.html
      - name: Run browser accessibility and media checks
        env:
          PLAYWRIGHT_MODULE: playwright
          AXE_PATH: node_modules/axe-core/axe.min.js
          RESULT_PATH: module2-browser-results.json
          SCREENSHOT_DIR: .
        run: node academy/tests/module2-browser.cjs
      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module2-browser-qa
          path: |
            module2-browser-results.json
            module2-overview.png
            module2-lesson.png
          if-no-files-found: ignore
